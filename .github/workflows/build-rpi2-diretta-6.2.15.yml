name: Build RPi2 Diretta Linux 6.2.15 and audit module ABI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ARCH: arm
      CROSS_COMPILE: arm-linux-gnueabihf-
      KERNEL_COMMIT: 3c6c5ba197a9daf02c77ae39d65677c5e63e0845
    steps:
      - name: Install ARM cross-build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex make gcc-12-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf libssl-dev libelf-dev \
            dwarves python3 rsync cpio gzip dpkg-dev kmod busybox-static:amd64
          # Kconfig probes the unversioned CROSS_COMPILE gcc name.
          # Ubuntu provides the pinned GCC 12 binary with a -12 suffix.
          sudo ln -sf "$(command -v arm-linux-gnueabihf-gcc-12)" /usr/local/bin/arm-linux-gnueabihf-gcc
          arm-linux-gnueabihf-gcc --version
          arm-linux-gnueabihf-gcc-12 --version
          make --version | head -n 1
          # Install a statically linked ARMHF BusyBox for a real initramfs.
          sudo dpkg --add-architecture armhf

          # Ubuntu 24.04 publishes armhf packages on ports.ubuntu.com,
          # not security.ubuntu.com. Keep the runner's native amd64 sources
          # restricted to amd64, then add the official ports archive for armhf.
          if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
            sudo sed -i '/^Architectures:/d; /^URIs:/a Architectures: amd64' \
              /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo tee /etc/apt/sources.list.d/ubuntu-armhf.sources >/dev/null <<'APT'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-backports noble-security
          Components: main universe
          Architectures: armhf
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          APT
          sudo apt-get update
          mkdir -p "$RUNNER_TEMP/busybox-armhf"
          cd "$RUNNER_TEMP/busybox-armhf"
          apt-get download busybox-static:armhf
          DEB="$(find . -maxdepth 1 -name 'busybox-static_*_armhf.deb' -print -quit)"
          test -n "$DEB"
          dpkg-deb -x "$DEB" extracted
          test -s extracted/bin/busybox || test -s extracted/usr/bin/busybox
          echo "BUSYBOX_ROOT=$RUNNER_TEMP/busybox-armhf/extracted" >> "$GITHUB_ENV"

      - name: Checkout ABI reference and config
        uses: actions/checkout@v4

      - name: Fetch pinned upstream Linux 6.2.15
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC="$RUNNER_TEMP/linux"
          git init "$SRC"
          git -C "$SRC" remote add origin https://github.com/torvalds/linux.git
          git -C "$SRC" fetch --depth=1 origin "$KERNEL_COMMIT"
          git -C "$SRC" checkout --detach FETCH_HEAD
          test "$(make -s -C "$SRC" ARCH=arm kernelversion)" = "6.2.15"
          test "$(git -C "$SRC" rev-parse HEAD)" = "$KERNEL_COMMIT"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Resolve and verify kernel configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$SRC"
          make ARCH=arm multi_v7_defconfig
          bash scripts/kconfig/merge_config.sh -m -r .config \
            "$GITHUB_WORKSPACE/config/rpi2-diretta-6.2.15.fragment"
          make ARCH=arm olddefconfig
          make ARCH=arm syncconfig
          cp .config "$GITHUB_WORKSPACE/rpi2-diretta-6.2.15.resolved.config"

          python3 - "$GITHUB_WORKSPACE/config/rpi2-diretta-6.2.15.fragment" .config <<'PY'
          import re, sys
          from pathlib import Path
          def parse(path):
              result = {}
              for raw in Path(path).read_text().splitlines():
                  line = raw.strip()
                  m = re.fullmatch(r"CONFIG_([A-Z0-9_]+)=(.*)", line)
                  if m:
                      result[m.group(1)] = m.group(2)
                      continue
                  m = re.fullmatch(r"# CONFIG_([A-Z0-9_]+) is not set", line)
                  if m:
                      result[m.group(1)] = "n"
              return result
          requested, final = parse(sys.argv[1]), parse(sys.argv[2])
          mismatches = [(k,v,final.get(k,"<absent>")) for k,v in requested.items()
                        if final.get(k,"n" if v=="n" else "<absent>") != v]
          required = {
              "ARCH_MULTI_V7":"y", "ARCH_BCM2835":"y", "CPU_V7":"y",
              "AEABI":"y", "SMP":"y", "PREEMPT":"y", "NEON":"y",
              "KERNEL_MODE_NEON":"y", "MODULES":"y", "MODULE_UNLOAD":"y",
              "MODVERSIONS":"n", "SND":"m", "SND_PCM":"m",
              "SND_USB_AUDIO":"m", "NET":"y", "PACKET":"y", "INET":"y",
              "USB":"y", "USB_DWC2":"y", "MMC":"y", "MMC_BLOCK":"m",
              "MMC_BCM2835":"y", "EXT4_FS":"y",
              "BLK_DEV_INITRD":"y", "RD_GZIP":"y",
              "SND_IMX_SOC":"n", "SND_SOC_FSL_ESAI":"n",
              "SND_SOC_FSL_SAI":"n", "SND_SOC_FSL_SSI":"n"
          }
          failed = [(k,v,final.get(k,"<absent>")) for k,v in required.items()
                    if final.get(k,"<absent>") != v]
          print(f"Fragment options={len(requested)}; resolved options={len(final)}")
          print(f"Config mismatches={len(mismatches)}; required failures={len(failed)}")
          for item in mismatches + failed:
              print("CONFIG_%s expected=%s actual=%s" % item)
          if mismatches or failed:
              raise SystemExit("CONFIG VALIDATION FAILED")
          print("CONFIG VALIDATION PASSED")
          PY

      - name: Build RPi2 kernel, selected modules, DTB and bootable initramfs
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::BUILD_STEP_FAILED line=${LINENO} exit=${rc} command=${BASH_COMMAND}"; exit "$rc"' ERR
          echo "BUILD_STEP_DIAGNOSTICS=enabled"
          cd "$SRC"
          export ARCH CROSS_COMPILE
          export KCFLAGS=""
          echo "Cross compiler:"
          arm-linux-gnueabihf-gcc-12 --version | head -n 1
          : > .scmversion

          # Build only the Raspberry Pi 2 Model B device tree, not every
          # board DTB in the multi_v7 tree.
          make -j2 ARCH=arm CROSS_COMPILE="$CROSS_COMPILE" \
            CC=arm-linux-gnueabihf-gcc-12 zImage modules \
            bcm2836-rpi-2-b.dtb

          KREL="$(make -s ARCH=arm CROSS_COMPILE="$CROSS_COMPILE" \
            CC=arm-linux-gnueabihf-gcc-12 kernelrelease)"
          echo "KERNELRELEASE=$KREL" | tee "$GITHUB_WORKSPACE/kernelrelease.txt"
          [[ "$KREL" == "6.2.15-215.fc36.armv7hl" ]]
          test -s arch/arm/boot/zImage
          test -s arch/arm/boot/dts/bcm2836-rpi-2-b.dtb
          test -s Module.symvers
          test -s System.map

          OUT="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUT/boot" "$OUT/modules"
          install -m 0644 arch/arm/boot/zImage "$OUT/boot/kernel7.img"
          install -m 0644 arch/arm/boot/dts/bcm2836-rpi-2-b.dtb \
            "$OUT/boot/bcm2836-rpi-2-b.dtb"
          # Keep the legacy filename used by the previous boot config too.
          install -m 0644 arch/arm/boot/dts/bcm2836-rpi-2-b.dtb \
            "$OUT/boot/bcm2709-rpi-2-b.dtb"
          cp System.map Module.symvers .config "$OUT/"

          make ARCH=arm CROSS_COMPILE="$CROSS_COMPILE" \
            CC=arm-linux-gnueabihf-gcc-12 \
            INSTALL_MOD_PATH="$OUT/modules" modules_install
          MODROOT="$OUT/modules/lib/modules/$KREL"
          test -d "$MODROOT"
          # modules_install creates links back to the source/build trees.
          # Remove them immediately, before any later validation can fail,
          # so a failed job cannot leave oversized trees for artifact upload.
          rm -f "$MODROOT/build" "$MODROOT/source"
          depmod -b "$OUT/modules" "$KREL"

          # Select Raspberry Pi platform support plus the audio and USB
          # networking stack needed by this audio appliance. Keep the complete
          # recursive modules.dep dependency closure before deleting anything.
          python3 - "$MODROOT" <<'PYMOD'
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          deps = {}
          for raw in (root / "modules.dep").read_text().splitlines():
              if ":" in raw:
                  name, values = raw.split(":", 1)
                  deps[name.strip()] = values.split()

          all_modules = {p.relative_to(root).as_posix() for p in root.rglob("*.ko")}
          required = {
              "kernel/drivers/mmc/core/mmc_block.ko",
              "kernel/sound/usb/snd-usb-audio.ko",
              "kernel/drivers/net/usb/smsc95xx.ko",
          }
          missing = sorted(required - all_modules)
          if missing:
              raise SystemExit("Required RPi2 boot/audio modules missing: " + ", ".join(missing))

          prefixes = (
              "kernel/sound/core/",
              "kernel/sound/usb/",
              "kernel/sound/soc/bcm/",
              "kernel/drivers/firmware/raspberrypi/",
              "kernel/drivers/gpu/drm/vc4/",
              "kernel/drivers/gpu/drm/v3d/",
          )
          # Select BCM283x / Pi-specific platform modules by filename rather
          # than retaining every generic I2C, SPI, MMC, or watchdog driver
          # built by multi_v7_defconfig.
          pi_tokens = (
              "bcm2835", "bcm2836", "bcm2708", "bcm2709",
              "pinctrl-bcm", "vc4", "v3d",
          )
          exact = {
              "kernel/drivers/i2c/busses/i2c-bcm2835.ko",
              "kernel/drivers/spi/spi-bcm2835.ko",
              "kernel/drivers/char/hw_random/bcm2835-rng.ko",
              "kernel/drivers/watchdog/bcm2835_wdt.ko",
              "kernel/sound/soc/soc-core.ko",
          }
          selected = {
              n for n in all_modules
              if n.startswith(prefixes)
              or Path(n).name.removesuffix(".ko").startswith(pi_tokens)
              or n in exact
          }
          selected.update(required)
          selected.update(n for n in exact if n in all_modules)

          ordered, seen = [], set()
          def visit(name):
              if name in seen:
                  return
              seen.add(name)
              for dep in deps.get(name, []):
                  visit(dep)
              if name in all_modules:
                  ordered.append(name)

          for name in sorted(selected):
              visit(name)

          keep = set(ordered)
          removed = sorted(all_modules - keep)
          for name in removed:
              (root / name).unlink()
          print(f"RPi2/audio modules retained: {len(keep)} of {len(all_modules)}")
          for name in ordered:
              print("KEEP " + name)
          print(f"Unrelated modules removed: {len(removed)}")
          PYMOD

          # Rebuild indexes after pruning. Source-tree symlinks were removed
          # immediately after modules_install above.
          depmod -b "$OUT/modules" "$KREL"
          MOD_COUNT="$(find "$MODROOT" -type f -name '*.ko' | wc -l)"
          echo "Packaged RPi2/audio modules: $MOD_COUNT"
          test "$MOD_COUNT" -gt 0

          # Build an initramfs that can actually locate the current root=PARTUUID.
          # MMC block support is modular in the validated config, so include it
          # and its complete dependency chain and load it before root discovery.
          INITRD="$RUNNER_TEMP/initramfs"
          mkdir -p "$INITRD"/{bin,dev,proc,sys,newroot}
          # The ARMHF BusyBox is a target executable and must never be run
          # directly on this x86_64 GitHub runner. Use the native amd64 build
          # to validate the applet set, then copy the ARMHF static binary into
          # the target initramfs.
          BUSYBOX_HOST="$(command -v busybox)"
          BUSYBOX_ARM="$BUSYBOX_ROOT/bin/busybox"
          [[ -x "$BUSYBOX_ARM" ]] || BUSYBOX_ARM="$BUSYBOX_ROOT/usr/bin/busybox"
          test -x "$BUSYBOX_HOST"
          test -s "$BUSYBOX_ARM"
          readelf -h "$BUSYBOX_ARM" | grep -q 'Machine:.*ARM'
          install -m 0755 "$BUSYBOX_ARM" "$INITRD/bin/busybox"
          for applet in sh mount mkdir sleep cat switch_root insmod mknod; do
            if ! "$BUSYBOX_HOST" --list | grep -qx "$applet"; then
              echo "Required BusyBox applet unavailable in host validation build: $applet" >&2
              exit 1
            fi
            ln -s busybox "$INITRD/bin/$applet"
          done

          python3 - "$MODROOT" "$INITRD" "$KREL" <<'PYMMC'
          import shutil, sys
          from pathlib import Path

          modroot, initrd, krel = Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3]
          target = "kernel/drivers/mmc/core/mmc_block.ko"
          deps = {}
          for raw in (modroot / "modules.dep").read_text().splitlines():
              if ":" in raw:
                  name, values = raw.split(":", 1)
                  deps[name.strip()] = values.split()

          ordered, seen = [], set()
          def visit(name):
              if name in seen:
                  return
              seen.add(name)
              for dep in deps.get(name, []):
                  visit(dep)
              path = modroot / name
              if not path.is_file():
                  raise SystemExit("Missing MMC module dependency: " + name)
              ordered.append(name)

          visit(target)
          destroot = initrd / "lib/modules" / krel
          commands = ["#!/bin/sh", "set -e"]
          for name in ordered:
              dest = destroot / name
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(modroot / name, dest)
              commands.append("/bin/insmod /lib/modules/" + krel + "/" + name)
          (initrd / "load-mmc-modules.sh").write_text("\n".join(commands) + "\n")
          print("Initramfs MMC module load order:")
          for name in ordered:
              print("  " + name)
          PYMMC

          cat > "$INITRD/init" <<'INIT'
          #!/bin/sh
          export PATH=/bin
          echo "initramfs: starting"
          mount -t devtmpfs devtmpfs /dev
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          [ -c /dev/console ] || mknod -m 600 /dev/console c 5 1
          exec </dev/console >/dev/console 2>&1
          echo "initramfs: kernel command line:"
          cat /proc/cmdline

          echo "initramfs: loading SD/MMC block modules"
          if ! /bin/sh /load-mmc-modules.sh; then
            echo "initramfs ERROR: MMC module loading failed"
            exec sh
          fi
          echo "initramfs: MMC block support loaded"

          ROOT_SPEC=""
          ROOT=""
          ROOTFSTYPE=""
          for arg in $(cat /proc/cmdline); do
            case "$arg" in
              root=*) ROOT_SPEC="${arg#root=}" ;;
              rootfstype=*) ROOTFSTYPE="${arg#rootfstype=}" ;;
            esac
          done
          if [ -z "$ROOT_SPEC" ]; then
            echo "initramfs ERROR: missing root= parameter"
            exec sh
          fi

          case "$ROOT_SPEC" in
            /dev/*)
              ROOT="$ROOT_SPEC"
              ;;
            PARTUUID=*)
              WANT_PARTUUID="${ROOT_SPEC#PARTUUID=}"
              echo "initramfs: resolving PARTUUID=$WANT_PARTUUID"
              n=0
              while [ -z "$ROOT" ] && [ "$n" -lt 30 ]; do
                for event in /sys/class/block/*/uevent; do
                  [ -r "$event" ] || continue
                  DEVNAME=""
                  PARTUUID=""
                  while IFS='=' read -r key value; do
                    case "$key" in
                      DEVNAME) DEVNAME="$value" ;;
                      PARTUUID) PARTUUID="$value" ;;
                    esac
                  done < "$event"
                  if [ "$PARTUUID" = "$WANT_PARTUUID" ] && [ -n "$DEVNAME" ]; then
                    ROOT="/dev/$DEVNAME"
                    break
                  fi
                done
                [ -n "$ROOT" ] || sleep 1
                n=$((n + 1))
              done
              ;;
            *)
              echo "initramfs ERROR: unsupported root= format: $ROOT_SPEC"
              exec sh
              ;;
          esac

          if [ -z "$ROOT" ]; then
            echo "initramfs ERROR: could not resolve root=$ROOT_SPEC"
            echo "initramfs: block devices:"
            for event in /sys/class/block/*/uevent; do
              [ -r "$event" ] && cat "$event"
            done
            exec sh
          fi
          echo "initramfs: root device resolved to $ROOT"

          n=0
          while [ ! -b "$ROOT" ] && [ "$n" -lt 30 ]; do
            sleep 1
            n=$((n + 1))
          done
          if [ ! -b "$ROOT" ]; then
            echo "initramfs ERROR: block device not present: $ROOT"
            exec sh
          fi

          if [ -n "$ROOTFSTYPE" ]; then
            mount -t "$ROOTFSTYPE" -o rw "$ROOT" /newroot
          else
            mount -o rw "$ROOT" /newroot
          fi
          if [ $? -ne 0 ] || [ ! -x /newroot/sbin/init ]; then
            echo "initramfs ERROR: root mount failed or /sbin/init missing"
            exec sh
          fi

          echo "initramfs: root filesystem mounted"
          mkdir -p /newroot/dev /newroot/proc /newroot/sys
          mount -o move /dev /newroot/dev
          mount -o move /proc /newroot/proc
          mount -o move /sys /newroot/sys
          echo "initramfs: switching to /sbin/init"
          exec switch_root /newroot /sbin/init
          INIT
          chmod 0755 "$INITRD/init"
          echo "INITRAMFS_INIT_SCRIPT_CREATED"
          (
            cd "$INITRD"
            find . -print0 | cpio --null -o --format=newc 2>/dev/null | gzip -9
          ) > "$OUT/boot/initramfs7"
          echo "INITRAMFS_ARCHIVE_CREATED"
          test -s "$OUT/boot/kernel7.img"
          test -s "$OUT/boot/initramfs7"
          gzip -t "$OUT/boot/initramfs7"
          echo "INITRAMFS_GZIP_VALIDATED"
          INITRD_LIST="$RUNNER_TEMP/initramfs-list.txt"
          # GNU cpio may print archive names with or without the leading "./".
          # Normalize the listing before validating exact archive paths.
          gzip -dc "$OUT/boot/initramfs7" | cpio -it 2>/dev/null | sed 's#^\./##' | sort > "$INITRD_LIST"
          grep -Fxq "init" "$INITRD_LIST"
          grep -Fxq "load-mmc-modules.sh" "$INITRD_LIST"
          grep -Fxq "bin/busybox" "$INITRD_LIST"
          grep -Fxq "lib/modules/$KREL/kernel/drivers/mmc/core/mmc_block.ko" "$INITRD_LIST"
          grep -Fq "PARTUUID=" "$INITRD/init"
          echo "Initramfs content validation passed:"
          cat "$INITRD_LIST"

          cat > "$OUT/boot/rpi2-config-example.txt" <<'BOOTCFG'
          # Merge these lines into the existing Raspberry Pi boot config.txt
          kernel=kernel7.img
          initramfs initramfs7 followkernel
          device_tree=bcm2709-rpi-2-b.dtb
          arm_64bit=0
          BOOTCFG
          cat > "$OUT/boot/cmdline-example.txt" <<'CMDLINE'
          # Keep the root PARTUUID from the existing Eunhasu SD-card image.
          console=serial0,115200 console=tty1 root=PARTUUID=REPLACE_WITH_REAL_PARTUUID rootwait rw
          CMDLINE

          echo "Final RPi2 boot payload:"
          find "$OUT/boot" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          echo "DTB count: $(find "$OUT/boot" -maxdepth 1 -type f -name '*.dtb' | wc -l)"
          echo "Packaged module count: $MOD_COUNT"
          du -sh "$OUT"
          test "$(find "$OUT/boot" -maxdepth 1 -type f -name '*.dtb' | wc -l)" -eq 2
          test -s "$OUT/modules/lib/modules/$KREL/modules.dep"
          test -s "$OUT/boot/initramfs7"
      - name: Audit all original Diretta undefined symbols
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$GITHUB_WORKSPACE" "$SRC/Module.symvers" <<'PY'
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          symvers = Path(sys.argv[2])
          exported = set()
          for line in symvers.read_text(errors="replace").splitlines():
              fields = line.split()
              if len(fields) >= 2:
                  exported.add(fields[1])
          files = [
              root / "a20-original/diretta/alsa_bridge.undefined-symbols.txt",
              root / "a20-original/diretta/diretta_direct.undefined-symbols.txt",
          ]
          all_symbols = set()
          for file in files:
              symbols = {line.split()[-1] for line in file.read_text().splitlines()
                         if line.split() and line.split()[0] == "U"}
              print(f"{file.name}: {len(symbols)} undefined symbols")
              all_symbols.update(symbols)
          missing = sorted(all_symbols - exported)
          present = sorted(all_symbols & exported)
          report = [
              f"Original unique undefined symbols: {len(all_symbols)}",
              f"Exported by target kernel: {len(present)}",
              f"Not exported by target kernel: {len(missing)}",
              "",
              "[NOT EXPORTED]",
              *missing,
              "",
              "[EXPORTED]",
              *present,
          ]
          (root / "diretta-symbol-audit.txt").write_text("\n".join(report) + "\n")
          print("\n".join(report))
          print("SYMBOL AUDIT COMPLETE (missing exports are reported, not treated as build failure)")
          PY
          cp "$GITHUB_WORKSPACE/diretta-symbol-audit.txt" "$GITHUB_WORKSPACE/out/"

      - name: Upload kernel build and ABI audit artifacts
        # Never publish partial outputs or diagnostics from a failed build.
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rpi2-diretta-linux-6.2.15-build
          path: |
            out/
            kernelrelease.txt
            diretta-symbol-audit.txt
            rpi2-diretta-6.2.15.resolved.config
          if-no-files-found: error
          compression-level: 6
